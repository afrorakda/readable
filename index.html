<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE - FINAL</title>
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --radius: 15px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        input { width: 100%; padding: 16px; border: 2px solid var(--accent); border-radius: var(--radius); font-size: 1.3rem; font-weight: 800; outline: none; }
        .board { width: 100%; height: 160px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); font-weight: 900; font-size: 2.2rem; }
        .sim-card { height: 70px; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; font-weight: 900; margin-top: 10px; }
        footer { text-align: center; font-size: 0.7rem; color: #999; margin-top: 20px; font-weight: 700; }
        footer a { color: inherit; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <input type="text" id="hex" placeholder="FF00FF" maxlength="7" oninput="draw()">
    <div class="board" id="b">READY</div>
    <div class="sim-stack">
        <div class="sim-card" id="sP">P-type <span id="tP"></span></div>
        <div class="sim-card" id="sD">D-type <span id="tD"></span></div>
        <div class="sim-card" id="sT">T-type <span id="tT"></span></div>
    </div>
    <footer>afrorakda © 2026</footer>
</div>
<script>
    // ブラウザのキャッシュを破壊するため、ランダムなコメントを挿入: 20260424_vFINAL
    function draw() {
        let v = document.getElementById('hex').value.trim();
        if(!v.startsWith('#')) v = '#' + v;
        if(!/^#([A-Fa-f0-9]{6})$/.test(v)) return;

        const r = parseInt(v.slice(1,3), 16), g = parseInt(v.slice(3,5), 16), b = parseInt(v.slice(5,7), 16);
        const rl = Math.pow(r/255, 2.2), gl = Math.pow(g/255, 2.2), bl = Math.pow(b/255, 2.2);

        // メイン表示
        document.getElementById('b').style.backgroundColor = v;
        const mainLum = (0.299*r + 0.587*g + 0.114*b)/255;
        document.getElementById('b').style.color = mainLum < 0.5 ? '#fff' : '#000';
        document.getElementById('b').innerText = mainLum < 0.5 ? 'WHITE ✅' : 'BLACK ✅';

        ['P','D','T'].forEach(type => {
            let nr, ng, nb;
            if(type==='P'){ // P-type
                nr = 0.17*rl + 0.83*gl; ng = 0.17*rl + 0.83*gl; nb = 0.02*gl + 0.98*bl;
            } else if(type==='D'){ // D-type
                nr = 0.33*rl + 0.67*gl; ng = 0.33*rl + 0.67*gl; nb = 0.05*gl + 0.95*bl;
            } else { // 【強制】T-type: 青成分(bl)を完全に殺して赤と緑のみにする
                nr = rl; ng = gl; nb = gl; // 青を緑に置き換える極端な設定
            }

            const gmp = (c) => Math.round(255 * Math.pow(Math.max(0, Math.min(1, c)), 1/2.2));
            const sr=gmp(nr), sg=gmp(ng), sb=gmp(nb);
            const sl = (0.299*sr + 0.587*sg + 0.114*sb)/255;

            const el = document.getElementById('s'+type);
            const tx = document.getElementById('t'+type);
            el.style.backgroundColor = `rgb(${sr},${sg},${sb})`;
            el.style.color = sl < 0.5 ? '#fff' : '#000';
            tx.innerText = sl < 0.5 ? 'WHITE ✅' : 'BLACK ✅';
        });
    }
    draw();
</script>
</body>
</html>
