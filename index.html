<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    <link rel="icon" href="image_114.png">
    <link rel="apple-touch-icon" href="image_114.png">
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --input-bg: #fafafa; --radius: 15px; --text-gray: #666; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        .input-card { background: var(--input-bg); padding: 18px; border-radius: var(--radius); border: 2px solid var(--accent); position: relative; }
        input { width: 100%; padding: 16px; padding-right: 50px; border: 2px solid var(--accent); border-radius: var(--radius); background: #fff; font-size: 1.3rem; font-weight: 800; color: var(--main) !important; outline: none; -webkit-appearance: none; -webkit-text-fill-color: var(--main) !important; }
        input::placeholder { color: #bbb !important; -webkit-text-fill-color: #bbb !important; opacity: 0.5 !important; }
        .clr-btn { position: absolute; right: 30px; top: 55px; width: 34px; height: 34px; background: #ccc; border: none; border-radius: 50%; color: #fff; font-size: 1.2rem; font-weight: 900; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; }
        .board { width: 100%; height: 180px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); font-weight: 900; font-size: 2.5rem; transition: background 0.2s; }
        .sim-stack { display: flex; flex-direction: column; gap: 10px; }
        .sim-card { width: 100%; height: 75px; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; font-weight: 800; transition: background 0.2s; }
        .sim-type { font-size: 0.75rem; opacity: 0.6; }
        .footer-btns { display: flex; gap: 10px; }
        .kofi-btn, .home-btn { flex: 1; height: 54px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 900; font-size: 0.9rem; border: none; cursor: pointer; }
        .kofi-btn { background: var(--main); color: #fff; }
        .home-btn { background: var(--accent); color: var(--main); }
        footer { text-align: center; font-size: 0.75rem; color: #999; font-weight: 700; margin-top: 10px; }
        footer a { color: inherit; text-decoration: underline; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 90%; max-width: 340px; padding: 35px; border-radius: var(--radius); position: relative; }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #ccc; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <div class="input-card">
        <label style="font-size:0.75rem;font-weight:900;color:var(--text-gray);margin-bottom:10px;display:block;">Background HEX</label>
        <input type="text" id="hexInput" placeholder="#FF00FF" maxlength="7" oninput="update()">
        <button class="clr-btn" id="clrBtn" onclick="clr()">×</button>
    </div>
    <div class="board" id="board" onclick="copy()">READY</div>
    <div class="sim-stack">
        <div class="sim-card" id="sP"><span class="sim-type">P-type</span><span id="rP"></span></div>
        <div class="sim-card" id="sD"><span class="sim-type">D-type</span><span id="rD"></span></div>
        <div class="sim-card" id="sT"><span class="sim-type">T-type</span><span id="rT"></span></div>
    </div>
    <div class="footer-btns">
        <a href="https://ko-fi.com/afrorakda" target="_blank" class="kofi-btn">☕️ buy me a coffee</a>
        <button class="home-btn" onclick="openM()">Add Home</button>
    </div>
    <footer>No login / No tracking / Browser only<br><a href="https://afrorakda.com/privacy/">Privacy Policy</a> / afrorakda © 2026</footer>
</div>
<div id="modal" onclick="closeM()"><div class="modal-content" onclick="event.stopPropagation()"><span class="close-x" onclick="closeM()">×</span><h3 style="margin-bottom:15px;font-weight:900;">📱 Install</h3><p style="font-size:0.9rem;font-weight:700;line-height:1.6">🍏 iPhone: Share > Add to Home<br>🤖 Android: Menu > Add to Home</p></div></div>
<script>
    const input = document.getElementById('hexInput'), clrBtn = document.getElementById('clrBtn'), board = document.getElementById('board');
    function clr() { input.value = ''; update(); input.focus(); }
    function openM() { document.getElementById('modal').style.display = 'flex'; }
    function closeM() { document.getElementById('modal').style.display = 'none'; }
    function copy() { let v = input.value; if(!v) return; if(!v.startsWith('#')) v = '#'+v; navigator.clipboard.writeText(v.toUpperCase()); let old = board.innerText; board.innerText = "COPIED!"; setTimeout(() => board.innerText = old, 800); }

    function update() {
        let v = input.value.trim().replace('#', '');
        clrBtn.style.display = v !== '' ? 'flex' : 'none';
        if (v.length !== 6) return;
        const r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
        
        // メイン反映
        const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        board.style.backgroundColor = '#' + v;
        board.style.color = l < 0.5 ? '#fff' : '#000';
        board.innerText = l < 0.5 ? 'WHITE ✅' : 'BLACK ✅';

        // P/D/T 反映 (絶対固定ロジック)
        const runSim = (id, rid, sr, sg, sb) => {
            const el = document.getElementById(id), tx = document.getElementById(rid);
            const color = `rgb(${sr},${sg},${sb})`;
            el.style.backgroundColor = color;
            const sl = (0.299 * sr + 0.587 * sg + 0.114 * sb) / 255;
            el.style.color = sl < 0.5 ? '#fff' : '#000';
            tx.innerText = sl < 0.5 ? 'WHITE ✅' : 'BLACK ✅';
        };

        // P-type (マゼンタが黄土色になる計算)
        runSim('sP', 'rP', Math.round(r*0.56 + g*0.44), Math.round(r*0.55 + g*0.45), Math.round(g*0.24 + b*0.76));
        // D-type (マゼンタがオリーブになる計算)
        runSim('sD', 'rD', Math.round(r*0.62 + g*0.38), Math.round(r*0.7 + g*0.3), Math.round(g*0.3 + b*0.7));
        // T-type (青を消して赤にする)
        runSim('sT', 'rT', r, g, 0);
    }
    update();
</script>
</body>
</html>
