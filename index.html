<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    
    <link rel="icon" href="image_114.png">
    <link rel="apple-touch-icon" href="image_114.png">

    <style>
        :root {
            --main: #333;
            --bg: #fff;
            --accent: #eee;
            --input-bg: #fafafa;
            --radius: 15px;
            --text-gray: #666;
        }

        /* 憲法: 15px角丸 / iOS Safari対策 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.8rem; font-weight: 800; margin: 0; letter-spacing: -1.5px; }

        .hub-link {
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--main);
            background: var(--accent);
            padding: 8px 14px;
            border-radius: var(--radius);
        }

        .input-card {
            background: var(--input-bg);
            padding: 18px;
            border-radius: var(--radius);
            border: 2px solid var(--accent);
        }

        .label {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--text-gray);
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
        }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        input {
            width: 100%;
            padding: 16px;
            padding-right: 50px;
            border: 2px solid var(--accent);
            border-radius: var(--radius);
            background: #fff;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--main) !important;
            outline: none;
            -webkit-appearance: none;
            -webkit-text-fill-color: var(--main) !important;
            opacity: 1 !important;
        }
        input::placeholder { color: #bbb !important; -webkit-text-fill-color: #bbb !important; }

        .clr-btn {
            position: absolute; right: 12px; width: 34px; height: 34px; background: #ccc;
            border: none; border-radius: 50%; color: #fff; font-size: 1.2rem; font-weight: 900;
            cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10;
        }

        .preview-board {
            width: 100%;
            height: 180px;
            border-radius: var(--radius);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--accent);
            cursor: pointer;
            font-weight: 900;
            font-size: 2.5rem;
            transition: transform 0.1s;
        }

        .sim-stack { display: flex; flex-direction: column; gap: 10px; }
        
        .sim-card {
            width: 100%; height: 75px; padding: 0 20px; border-radius: var(--radius);
            font-weight: 800; display: flex; align-items: center; justify-content: space-between;
            border: 2px solid var(--accent);
        }

        .footer-btns { display: flex; gap: 10px; margin-top: 5px; }
        .kofi-btn, .home-btn {
            flex: 1; height: 54px; border-radius: var(--radius); display: flex;
            align-items: center; justify-content: center; text-decoration: none;
            font-weight: 900; font-size: 0.9rem; border: none; cursor: pointer;
        }
        .kofi-btn { background: var(--main); color: #fff; -webkit-text-fill-color: #fff; }
        .home-btn { background: var(--accent); color: var(--main); }

        footer { text-align: center; font-size: 0.75rem; color: #999; line-height: 1.6; font-weight: 700; margin-top: 10px; }
        footer a { color: inherit; text-decoration: underline; }

        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #fff; width: 90%; max-width: 340px; padding: 35px;
            border-radius: var(--radius); position: relative;
        }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #ccc; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>READABLE</h1>
        <a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a>
    </header>

    <div class="input-card">
        <label class="label">Background HEX</label>
        <div class="input-wrapper">
            <input type="text" id="hexInput" placeholder="#FF00FF" maxlength="7" oninput="update()">
            <button class="clr-btn" id="clrBtn" onclick="clr()">×</button>
        </div>
    </div>

    <div class="preview-board" id="board" onclick="copy()">
        <span id="label">READY</span>
    </div>

    <p style="font-size:0.85rem;font-weight:900;margin-top:5px;">COLOR BLIND PREVIEW</p>
    <div class="sim-stack">
        <div class="sim-card" id="sP"><span style="font-size:0.75rem;opacity:0.6;">P-type</span><span id="rP"></span></div>
        <div class="sim-card" id="sD"><span style="font-size:0.75rem;opacity:0.6;">D-type</span><span id="rD"></span></div>
        <div class="sim-card" id="sT"><span style="font-size:0.75rem;opacity:0.6;">T-type</span><span id="rT"></span></div>
    </div>

    <div class="footer-btns">
        <a href="https://ko-fi.com/afrorakda" target="_blank" class="kofi-btn">☕️ buy me a coffee</a>
        <button class="home-btn" onclick="openM()">Add Home</button>
    </div>

    <footer>
        No login / No tracking / No ads / Browser only<br>
        <a href="https://afrorakda.com/privacy/">Privacy Policy</a> / afrorakda © 2026
    </footer>
</div>

<div id="modal" onclick="closeM()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-x" onclick="closeM()">×</span>
        <h3 style="margin-bottom:15px; font-weight: 900;">📱 Install</h3>
        <p style="font-size: 0.9rem; line-height: 1.6; font-weight: 700;">
            🍏 <strong>iPhone:</strong><br>Share > Add to Home Screen<br><br>
            🤖 <strong>Android:</strong><br>Menu (⋮) > Add to Home Screen
        </p>
    </div>
</div>

<script>
    const input = document.getElementById('hexInput');
    const clrBtn = document.getElementById('clrBtn');
    const board = document.getElementById('board');
    const label = document.getElementById('label');

    function clr() { input.value = ''; update(); input.focus(); }
    function openM() { document.getElementById('modal').style.display = 'flex'; }
    function closeM() { document.getElementById('modal').style.display = 'none'; }

    function update() {
        let v = input.value.trim().replace('#', '');
        clrBtn.style.display = v !== '' ? 'flex' : 'none';
        if (v.length !== 6) return;

        const r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
        
        // メイン反映
        const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        board.style.backgroundColor = '#' + v;
        label.style.color = l < 0.5 ? '#fff' : '#000';
        label.innerText = l < 0.5 ? 'WHITE ✅' : 'BLACK ✅';

        // シミュレーション実行用内部関数
        const runSim = (cardId, resId, sr, sg, sb) => {
            const el = document.getElementById(cardId);
            const res = document.getElementById(resId);
            const cr = Math.max(0, Math.min(255, Math.round(sr)));
            const cg = Math.max(0, Math.min(255, Math.round(sg)));
            const cb = Math.max(0, Math.min(255, Math.round(sb)));
            
            el.style.backgroundColor = `rgb(${cr},${cg},${cb})`;
            const sl = (0.299 * cr + 0.587 * cg + 0.114 * cb) / 255;
            el.style.color = sl < 0.5 ? '#fff' : '#000';
            res.innerText = sl < 0.5 ? 'WHITE ✅' : 'BLACK ✅';
        };

        // P/D/T 本格マトリクス演算
        // P-type: 赤錐体欠落
        runSim('sP', 'rP', r*0.566 + g*0.433, r*0.558 + g*0.441, g*0.241 + b*0.758);
        // D-type: 緑錐体欠落
        runSim('sD', 'rD', r*0.625 + g*0.375, r*0.7 + g*0.3, g*0.3 + b*0.7);
        // T-type: 青錐体欠落
        runSim('sT', 'rT', r, g, 0);
    }

    async function copy() {
        let v = input.value.trim(); if (!v) return;
        if (!v.startsWith('#')) v = '#' + v;
        await navigator.clipboard.writeText(v.toUpperCase());
        const old = label.innerText; label.innerText = "COPIED!";
        setTimeout(() => { label.innerText = old; }, 800);
    }

    update();
</script>

</body>
</html>
