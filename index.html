<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --radius: 15px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        input { width: 100%; padding: 16px; border: 2px solid var(--accent); border-radius: var(--radius); font-size: 1.3rem; font-weight: 800; outline: none; }
        .board { width: 100%; height: 160px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); font-weight: 900; font-size: 2.2rem; }
        .sim-card { height: 70px; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; font-weight: 900; margin-top: 10px; }
        footer { text-align: center; font-size: 0.7rem; color: #999; margin-top: 20px; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <input type="text" id="hex" placeholder="FF00FF" maxlength="7" oninput="draw()">
    <div class="board" id="b">READY</div>
    <div class="sim-stack">
        <div class="sim-card" id="sP">P-type <span id="tP"></span></div>
        <div class="sim-card" id="sD">D-type <span id="tD"></span></div>
        <div class="sim-card" id="sT">T-type <span id="tT"></span></div>
    </div>
    <footer>afrorakda © 2026</footer>
</div>
<script>
    function draw() {
        let v = document.getElementById('hex').value.trim().replace('#', '');
        if (v.length !== 6) return;

        const r = parseInt(v.slice(0, 2), 16);
        const g = parseInt(v.slice(2, 4), 16);
        const b = parseInt(v.slice(4, 6), 16);

        // メイン反映
        const board = document.getElementById('b');
        board.style.backgroundColor = '#' + v;
        const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        board.style.color = l < 0.5 ? '#fff' : '#000';
        board.innerText = l < 0.5 ? 'WHITE ✅' : 'BLACK ✅';

        // P-type: 赤を緑に寄せる
        const pr = Math.round(r * 0.56 + g * 0.44);
        const pg = Math.round(r * 0.55 + g * 0.45);
        updateCard('sP', 'tP', pr, pg, b);

        // D-type: 緑を赤に寄せる
        const dr = Math.round(r * 0.62 + g * 0.38);
        const dg = Math.round(r * 0.7 + g * 0.3);
        updateCard('sD', 'tD', dr, dg, b);

        // T-type: 青を完全に消す (FORCE RED)
        // 3型は青が識別できない＝青成分が輝度に寄与しない、または緑と混同する
        // ここでは極端に「Bを0」にして、RとGのみで色を作る
        updateCard('sT', 'tT', r, g, 0);
    }

    function updateCard(id, tid, r, g, b) {
        const el = document.getElementById(id);
        const tx = document.getElementById(tid);
        const color = `rgb(${r},${g},${b})`;
        el.style.backgroundColor = color;
        const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        el.style.color = l < 0.5 ? '#fff' : '#000';
        tx.innerText = l < 0.5 ? 'WHITE ✅' : 'BLACK ✅';
    }
</script>
</body>
</html>
