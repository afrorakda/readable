<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --radius: 15px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        input { width: 100%; padding: 16px; border: 2px solid var(--accent); border-radius: var(--radius); font-size: 1.3rem; font-weight: 800; outline: none; -webkit-appearance: none; }
        .board { width: 100%; height: 160px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); font-weight: 900; font-size: 2.2rem; }
        .sim-card { height: 70px; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; font-weight: 900; margin-top: 10px; }
        footer { text-align: center; font-size: 0.7rem; color: #999; margin-top: 20px; font-weight: 700; }
        footer a { color: inherit; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <input type="text" id="hex" placeholder="FF00FF" maxlength="7" oninput="draw()">
    <div class="board" id="b">BLACK ✅</div>
    <div class="sim-card" id="sP">P-type <span id="tP"></span></div>
    <div class="sim-card" id="sD">D-type <span id="tD"></span></div>
    <div class="sim-card" id="sT">T-type <span id="tT"></span></div>
    <footer>
        <a href="https://ko-fi.com/afrorakda">Ko-fi</a> / <a href="https://afrorakda.com/privacy/">Privacy Policy</a> / afrorakda © 2026
    </footer>
</div>
<script>
    function draw() {
        let v = document.getElementById('hex').value;
        if(!v.startsWith('#')) v = '#' + v;
        if(!/^#([A-Fa-f0-9]{6})$/.test(v)) return;
        const r = parseInt(v.slice(1,3),16), g = parseInt(v.slice(3,5),16), b = parseInt(v.slice(5,7),16);
        const l = (0.299*r+0.587*g+0.114*b)/255;
        document.getElementById('b').style.backgroundColor = v;
        document.getElementById('b').style.color = l < 0.5 ? '#fff':'#000';
        document.getElementById('b').innerText = l < 0.5 ? 'WHITE ✅':'BLACK ✅';
        ['P','D','T'].forEach(t => {
            let rl=Math.pow(r/255,2.2), gl=Math.pow(g/255,2.2), bl=Math.pow(b/255,2.2), nr, ng, nb;
            if(t==='P'){ nr=0.56*rl+0.44*gl; ng=0.55*rl+0.45*gl; nb=0.24*gl+0.76*bl; }
            else if(t==='D'){ nr=0.62*rl+0.38*gl; ng=0.7*rl+0.3*gl; nb=0.3*gl+0.7*bl; }
            // 【修正】T-type（Tritanopia）の計算式を強化（青成分を極限までカット）
            else { nr=0.95*rl+0.05*bl; ng=0.43*gl+0.57*bl; nb=0*gl+1*bl; } 
            
            const gmp = (c) => Math.round(255 * Math.pow(Math.max(0,c), 1/2.2));
            const sr=gmp(nr), sg=gmp(ng), sb=gmp(nb), sl=(0.299*sr+0.587*sg+0.114*sb)/255;
            const el=document.getElementById('s'+t), tx=document.getElementById('t'+t);
            el.style.backgroundColor = `rgb(${sr},${sg},${sb})`;
            el.style.color = sl < 0.5 ? '#fff':'#000';
            tx.innerText = sl < 0.5 ? 'WHITE ✅':'BLACK ✅';
        });
    }
    // 初期表示（FF00FF）
    draw();
</script>
</body>
</html>
