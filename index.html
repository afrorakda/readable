<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE - Fixed Edition</title>
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --input-bg: #fafafa; --radius: 15px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        .input-card { background: var(--input-bg); padding: 18px; border-radius: var(--radius); border: 2px solid var(--accent); }
        input { width: 100%; padding: 16px; border: 2px solid var(--accent); border-radius: var(--radius); font-size: 1.3rem; font-weight: 800; -webkit-appearance: none; }
        
        /* プレビューボード */
        .preview-board { width: 100%; height: 160px; border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid var(--accent); margin-bottom: 10px; }
        .preview-text { font-weight: 900; font-size: 2.2rem; }

        /* シミュレーション窓（ここが重要） */
        .sim-stack { display: flex; flex-direction: column; gap: 8px; }
        .sim-card { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); font-weight: 900; }
        .sim-val { font-size: 0.7rem; opacity: 0.6; }

        footer { text-align: center; font-size: 0.75rem; color: #999; margin-top: 20px; }
        footer a { color: inherit; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>READABLE</h1>
        <a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a>
    </header>

    <div class="input-card">
        <input type="text" id="hexInput" placeholder="#FF0000" maxlength="7">
    </div>

    <div class="preview-board" id="board">
        <div id="mainText" class="preview-text">EXAMPLE</div>
    </div>

    <div class="sim-stack">
        <div class="sim-card" id="simP"><span>P-type</span><span class="sim-val" id="valP"></span></div>
        <div class="sim-card" id="simD"><span>D-type</span><span class="sim-val" id="valD"></span></div>
        <div class="sim-card" id="simT"><span>T-type</span><span class="sim-val" id="valT"></span></div>
    </div>

    <footer id="dynamicFooter">
        <a href="https://ko-fi.com/afrorakda">Ko-fi</a> / <a href="https://afrorakda.com/privacy/">Privacy Policy</a> / afrorakda © 2026
    </footer>
</div>

<script>
    const input = document.getElementById('hexInput');
    
    // 色覚変換ロジック（高精度マトリクス）
    function simulate(r, g, b, type) {
        // 線形化
        let rl = Math.pow(r/255, 2.2), gl = Math.pow(g/255, 2.2), bl = Math.pow(b/255, 2.2);
        let nr, ng, nb;

        if (type === 'P') { // 1型
            nr = 0.56667 * rl + 0.43333 * gl;
            ng = 0.55833 * rl + 0.44167 * gl;
            nb = 0.24167 * gl + 0.75833 * bl;
        } else if (type === 'D') { // 2型
            nr = 0.625 * rl + 0.375 * gl;
            ng = 0.7 * rl + 0.3 * gl;
            nb = 0.3 * gl + 0.7 * bl;
        } else if (type === 'T') { // 3型
            nr = 0.95 * rl + 0.05 * bl;
            ng = 0.43333 * gl + 0.56667 * bl;
            nb = 0.475 * gl + 0.525 * bl;
        }

        // sRGBに戻す
        return [
            Math.round(Math.pow(Math.max(0, Math.min(1, nr)), 1/2.2) * 255),
            Math.round(Math.pow(Math.max(0, Math.min(1, ng)), 1/2.2) * 255),
            Math.round(Math.pow(Math.max(0, Math.min(1, nb)), 1/2.2) * 255)
        ];
    }

    function update() {
        let val = input.value;
        if (!val.startsWith('#')) val = '#' + val;
        if (!/^#([A-Fa-f0-9]{6})$/.test(val)) return;

        const r = parseInt(val.substring(1,3), 16);
        const g = parseInt(val.substring(3,5), 16);
        const b = parseInt(val.substring(5,7), 16);

        // メイン反映
        document.getElementById('board').style.backgroundColor = val;
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        document.getElementById('mainText').style.color = lum > 0.5 ? '#000' : '#fff';

        // シミュレーション反映
        ['P', 'D', 'T'].forEach(type => {
            const [sr, sg, sb] = simulate(r, g, b, type);
            const resHex = `#${((1 << 24) + (sr << 16) + (sg << 8) + sb).toString(16).slice(1).toUpperCase()}`;
            const el = document.getElementById('sim' + type);
            el.style.backgroundColor = resHex;
            const sLum = (0.299 * sr + 0.587 * sg + 0.114 * sb) / 255;
            el.style.color = sLum > 0.5 ? '#000' : '#fff';
            document.getElementById('val' + type).innerText = resHex;
        });
    }

    input.addEventListener('input', update);
</script>
</body>
</html>
