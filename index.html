<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    <link rel="icon" href="image_114.png">
    <link rel="apple-touch-icon" href="image_114.png">
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --input-bg: #fafafa; --radius: 15px; --text-gray: #666; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--main); display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.8rem; font-weight: 800; margin: 0; letter-spacing: -1.5px; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        .input-card { background: var(--input-bg); padding: 18px; border-radius: var(--radius); border: 2px solid var(--accent); }
        .label { font-size: 0.75rem; font-weight: 900; color: var(--text-gray); margin-bottom: 10px; display: block; text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        input { width: 100%; padding: 16px; padding-right: 50px; border: 2px solid var(--accent); border-radius: var(--radius); background: #fff; font-size: 1.3rem; font-weight: 800; color: var(--main) !important; outline: none; -webkit-appearance: none; -webkit-text-fill-color: var(--main) !important; opacity: 1 !important; }
        input::placeholder { color: #bbb !important; -webkit-text-fill-color: #bbb !important; }
        .clr-btn { position: absolute; right: 12px; width: 34px; height: 34px; background: #ccc; border: none; border-radius: 50%; color: #fff; font-size: 1.2rem; font-weight: 900; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; }
        .preview-board { width: 100%; height: 180px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); cursor: pointer; font-weight: 900; font-size: 2.5rem; transition: transform 0.1s, background 0.2s; }
        .sim-stack { display: flex; flex-direction: column; gap: 10px; }
        .sim-card { width: 100%; height: 75px; padding: 0 20px; border-radius: var(--radius); font-weight: 800; display: flex; align-items: center; justify-content: space-between; border: 2px solid var(--accent); }
        .footer-btns { display: flex; gap: 10px; margin-top: 5px; }
        .kofi-btn, .home-btn { flex: 1; height: 54px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 900; font-size: 0.9rem; border: none; cursor: pointer; }
        .kofi-btn { background: var(--main); color: #fff; -webkit-text-fill-color: #fff; }
        .home-btn { background: var(--accent); color: var(--main); }
        footer { text-align: center; font-size: 0.75rem; color: #999; line-height: 1.6; font-weight: 700; margin-top: 10px; }
        footer a { color: inherit; text-decoration: underline; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 90%; max-width: 340px; padding: 35px; border-radius: var(--radius); position: relative; }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <div class="input-card">
        <label class="label">Background HEX</label>
        <div class="input-wrapper">
            <input type="text" id="hexInput" placeholder="#FF00FF" maxlength="7" oninput="updateUI()">
            <button class="clr-btn" id="clrBtn" onclick="clearInput()">×</button>
        </div>
    </div>
    <div class="preview-board" id="board" onclick="copyHex()"><span id="mainLabel">READY</span></div>
    <p style="font-size:0.85rem;font-weight:900;margin-top:5px;">COLOR BLIND PREVIEW</p>
    <div class="sim-stack">
        <div class="sim-card" id="simP"><span style="font-size:0.75rem;opacity:0.6;">P-type</span><span id="resP"></span></div>
        <div class="sim-card" id="simD"><span style="font-size:0.75rem;opacity:0.6;">D-type</span><span id="resD"></span></div>
        <div class="sim-card" id="simT"><span style="font-size:0.75rem;opacity:0.6;">T-type</span><span id="resT"></span></div>
    </div>
    <div class="footer-btns"><a href="https://ko-fi.com/afrorakda" target="_blank" class="kofi-btn">☕️ buy me a coffee</a><button class="home-btn" onclick="showM()">Add Home</button></div>
    <footer>No login / No tracking / No ads / Browser only<br><a href="https://afrorakda.com/privacy/">Privacy Policy</a> / afrorakda © 2026</footer>
</div>
<div id="modal" onclick="hideM()"><div class="modal-content" onclick="event.stopPropagation()"><span class="close-x" onclick="hideM()">×</span><h3 style="margin-bottom:15px;font-weight:900;">📱 Install</h3><p style="font-size:0.9rem;font-weight:700;line-height:1.6">🍏 iPhone: Share > Add to Home<br>🤖 Android: Menu > Add to Home</p></div></div>
<script>
    const input = document.getElementById('hexInput'), clrBtn = document.getElementById('clrBtn'), board = document.getElementById('board'), label = document.getElementById('mainLabel');
    function clearInput() { input.value = ''; updateUI(); input.focus(); }
    function showM() { document.getElementById('modal').style.display = 'flex'; }
    function hideM() { document.getElementById('modal').style.display = 'none'; }
    function updateUI() {
        let v = input.value.trim().replace('#', '');
        clrBtn.style.display = v !== '' ? 'flex' : 'none';
        if (v.length !== 6) return;
        const r = parseInt(v.slice(0, 2), 16), g = parseInt(v.slice(2, 4), 16), b = parseInt(v.slice(4, 6), 16);
        const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        board.style.backgroundColor = '#' + v;
        label.style.color = l < 0.5 ? '#fff' : '#000';
        label.innerText = l < 0.5 ? 'WHITE ✅' : 'BLACK ✅';
        const set = (id, rid, sr, sg, sb) => {
            const el = document.getElementById(id), rs = document.getElementById(rid);
            const r_ok = Math.max(0, Math.min(255, Math.round(sr)));
            const g_ok = Math.max(0, Math.min(255, Math.round(sg)));
            const b_ok = Math.max(0, Math.min(255, Math.round(sb)));
            el.style.backgroundColor = 'rgb('+r_ok+','+g_ok+','+b_ok+')';
            const sl = (0.299*r_ok+0.587*g_ok+0.114*b_ok)/255;
            el.style.color = sl < 0.5 ? '#fff':'#000';
            rs.innerText = sl < 0.5 ? 'WHITE ✅':'BLACK ✅';
        };
        set('simP', 'resP', r*0.56+g*0.44, r*0.55+g*0.45, g*0.24+b*0.76);
        set('simD', 'resD', r*0.62+g*0.38, r*0.7+g*0.3, g*0.3+b*0.7);
        set('simT', 'resT', r, g, 0);
    }
    async function copyHex() {
        let v = input.value.trim(); if(!v) return;
        if(!v.startsWith('#')) v = '#' + v;
        await navigator.clipboard.writeText(v.toUpperCase());
        const old = label.innerText; label.innerText = "COPIED!";
        setTimeout(() => { label.innerText = old; }, 800);
    }
    updateUI();
</script>
</body>
</html>
