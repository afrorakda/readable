<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --radius: 15px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        .input-card { background: #fafafa; padding: 18px; border-radius: var(--radius); border: 2px solid var(--accent); position: relative; }
        input { width: 100%; padding: 16px; border: 2px solid var(--accent); border-radius: var(--radius); font-size: 1.3rem; font-weight: 800; outline: none; -webkit-appearance: none; }
        input::placeholder { color: #bbb !important; }
        .clr-btn { position: absolute; right: 30px; top: 50px; width: 34px; height: 34px; background: #ccc; border: none; border-radius: 50%; color: #fff; font-weight: 900; cursor: pointer; display: none; align-items: center; justify-content: center; }
        .board { width: 100%; height: 180px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); font-weight: 900; font-size: 2.5rem; }
        .sim-card { height: 75px; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: space-between; font-weight: 800; margin-top: 10px; }
        .kofi-btn, .home-btn { flex: 1; height: 54px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 900; font-size: 0.9rem; border: none; }
        .kofi-btn { background: var(--main); color: #fff; }
        .home-btn { background: var(--accent); color: var(--main); }
        footer { text-align: center; font-size: 0.75rem; color: #999; font-weight: 700; margin-top: 10px; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; width: 90%; max-width: 340px; padding: 35px; border-radius: var(--radius); position: relative; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <div class="input-card">
        <input type="text" id="hex" placeholder="#FF00FF" maxlength="7" oninput="run()">
        <button class="clr-btn" id="clr" onclick="document.getElementById('hex').value='';run();">×</button>
    </div>
    <div class="board" id="b" onclick="let v=document.getElementById('hex').value;navigator.clipboard.writeText(v);this.innerText='COPIED!';setTimeout(()=>run(),800)">READY</div>
    <div class="sim-stack">
        <div class="sim-card" id="sP">P-type <span id="rP"></span></div>
        <div class="sim-card" id="sD">D-type <span id="rD"></span></div>
        <div class="sim-card" id="sT">T-type <span id="rT"></span></div>
    </div>
    <div class="footer-btns">
        <a href="https://ko-fi.com/afrorakda" target="_blank" class="kofi-btn">☕️ buy me a coffee</a>
        <button class="home-btn" onclick="document.getElementById('modal').style.display='flex'">Add Home</button>
    </div>
    <footer>No login / No tracking / Browser only<br><a href="https://afrorakda.com/privacy/">Privacy Policy</a> / afrorakda © 2026</footer>
</div>
<div id="modal" onclick="this.style.display='none'"><div class="modal-content"><h3>📱 Install</h3><p>Share > Add to Home Screen</p></div></div>

<script>
    function run() {
        let v = document.getElementById('hex').value.trim().replace('#', '');
        document.getElementById('clr').style.display = v ? 'flex' : 'none';
        if (v.length !== 6) return;
        let r = parseInt(v.slice(0,2),16), g = parseInt(v.slice(2,4),16), b = parseInt(v.slice(4,6),16);
        
        // Main
        let l = (0.299*r + 0.587*g + 0.114*b)/255;
        document.getElementById('b').style.backgroundColor = '#' + v;
        document.getElementById('b').style.color = l < 0.5 ? '#fff' : '#000';
        document.getElementById('b').innerText = l < 0.5 ? 'WHITE ✅' : 'BLACK ✅';

        // P-type
        let pr=r*0.56+g*0.44, pg=r*0.55+g*0.45, pb=g*0.24+b*0.76;
        let pL=(0.299*pr+0.587*pg+0.114*pb)/255;
        document.getElementById('sP').style.backgroundColor = 'rgb('+pr+','+pg+','+pb+')';
        document.getElementById('sP').style.color = pL<0.5?'#fff':'#000';
        document.getElementById('rP').innerText = pL<0.5?'WHITE ✅':'BLACK ✅';

        // D-type
        let dr=r*0.62+g*0.38, dg=r*0.7+g*0.3, db=g*0.3+b*0.7;
        let dL=(0.299*dr+0.587*dg+0.114*db)/255;
        document.getElementById('sD').style.backgroundColor = 'rgb('+dr+','+dg+','+db+')';
        document.getElementById('sD').style.color = dL<0.5?'#fff':'#000';
        document.getElementById('rD').innerText = dL<0.5?'WHITE ✅':'BLACK ✅';

        // T-type
        document.getElementById('sT').style.backgroundColor = 'rgb('+r+','+g+',0)';
        let tL=(0.299*r+0.587*g+0)/255;
        document.getElementById('sT').style.color = tL<0.5?'#fff':'#000';
        document.getElementById('rT').innerText = tL<0.5?'WHITE ✅':'BLACK ✅';
    }
    run();
</script>
</body>
</html>
