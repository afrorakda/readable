<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>READABLE</title>
    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --input-bg: #fafafa; --radius: 15px; --text-gray: #666; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--main); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .hub-link { text-decoration: none; font-size: 0.8rem; font-weight: 800; color: var(--main); background: var(--accent); padding: 8px 14px; border-radius: var(--radius); }
        .input-card { background: var(--input-bg); padding: 18px; border-radius: var(--radius); border: 2px solid var(--accent); }
        input { width: 100%; padding: 16px; border: 2px solid var(--accent); border-radius: var(--radius); font-size: 1.3rem; font-weight: 800; outline: none; }
        .preview-board { width: 100%; height: 160px; border-radius: var(--radius); display: flex; justify-content: center; align-items: center; border: 2px solid var(--accent); margin-top: 10px; position: relative; }
        .preview-text { font-weight: 900; font-size: 2.2rem; }
        .sim-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .sim-card { height: 75px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: var(--radius); border: 2px solid var(--accent); font-weight: 900; }
        .sim-type { opacity: 0.6; font-size: 0.75rem; }
        footer { text-align: center; font-size: 0.75rem; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>READABLE</h1><a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a></header>
    <div class="input-card"><input type="text" id="hexInput" placeholder="FF0000" maxlength="7"></div>
    <div class="preview-board" id="board"><div id="mainText" class="preview-text">WHITE ✅</div></div>
    <div class="sim-stack">
        <div class="sim-card" id="simP"><span>P-type</span><span id="txtP">WHITE ✅</span></div>
        <div class="sim-card" id="simD"><span>D-type</span><span id="txtD">WHITE ✅</span></div>
        <div class="sim-card" id="simT"><span>T-type</span><span id="txtT">WHITE ✅</span></div>
    </div>
    <footer>afrorakda © 2026</footer>
</div>

<script>
    const input = document.getElementById('hexInput');
    
    // 正確な色覚変換マトリクス（Meyer, 1988等に基づく）
    function simulate(r, g, b, type) {
        // 1. 線形化 (sRGB to Linear)
        const l = (c) => c <= 10 ? c / 3294 : Math.pow((c / 255 + 0.055) / 1.055, 2.4);
        let rl = l(r), gl = l(g), bl = l(b);
        let nr, ng, nb;

        if (type === 'P') { // 1型 (Protanopia)
            nr = 0.56667 * rl + 0.43333 * gl;
            ng = 0.55833 * rl + 0.44167 * gl;
            nb = 0.24167 * gl + 0.75833 * bl;
        } else if (type === 'D') { // 2型 (Deuteranopia)
            nr = 0.625 * rl + 0.375 * gl;
            ng = 0.7 * rl + 0.3 * gl;
            nb = 0.3 * gl + 0.7 * bl;
        } else if (type === 'T') { // 3型 (Tritanopia)
            nr = 0.95 * rl + 0.05 * bl;
            ng = 0.43333 * gl + 0.56667 * bl;
            nb = 0.475 * gl + 0.525 * bl;
        }

        // 2. ガンマ補正 (Linear to sRGB)
        const gmp = (c) => Math.round(255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055));
        return [gmp(nr), gmp(ng), gmp(nb)];
    }

    function getLum(r, g, b) { return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

    function update() {
        let val = input.value.trim();
        if (!val) return;
        if (!val.startsWith('#')) val = '#' + val;
        if (!/^#([A-Fa-f0-9]{6})$/.test(val)) return;

        const r = parseInt(val.substring(1,3), 16);
        const g = parseInt(val.substring(3,5), 16);
        const b = parseInt(val.substring(5,7), 16);

        // メイン反映
        const board = document.getElementById('board');
        board.style.backgroundColor = val;
        const mainIsDark = getLum(r, g, b) < 0.5;
        document.getElementById('mainText').innerText = mainIsDark ? "WHITE ✅" : "BLACK ✅";
        document.getElementById('mainText').style.color = mainIsDark ? "#fff" : "#000";

        // 各窓反映
        ['P', 'D', 'T'].forEach(type => {
            const [sr, sg, sb] = simulate(r, g, b, type);
            const card = document.getElementById('sim' + type);
            const txt = document.getElementById('txt' + type);
            card.style.backgroundColor = `rgb(${sr},${sg},${sb})`;
            const isDark = getLum(sr, sg, sb) < 0.5;
            card.style.color = isDark ? "#fff" : "#000";
            txt.innerText = isDark ? "WHITE ✅" : "BLACK ✅";
        });
    }

    input.addEventListener('input', update);
</script>
</body>
</html>
